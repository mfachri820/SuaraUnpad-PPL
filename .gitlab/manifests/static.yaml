# Config non-rahasia yang sama untuk staging & production.
# Secret (JWT_SECRET, PAUS_CLIENT_SECRET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# BUKAN di sini: isi di GitLab Settings > CI/CD > Variables dengan prefix K8S_SECRET_.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${HELM_RELEASE_NAME}-static
  namespace: ${KUBE_NAMESPACE}
data:
  NODE_ENV: "production"
  APP_URL: ${CI_ENVIRONMENT_URL}
  DB_POOL_MAX: "10"

  # Login hanya lewat PAuS.
  PASSWORD_LOGIN_ENABLED: "false"

  # MinIO platform (nilai sama seperti Prabu).
  AWS_ENDPOINT: "https://nodes.minio.unpad.dev"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AWS_DEFAULT_REGION: "id-dipatiukur-1"
