# Config non-rahasia khusus production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${HELM_RELEASE_NAME}-config
  namespace: ${KUBE_NAMESPACE}
data:
  # Client PAuS (client secret ada di GitLab var K8S_SECRET_PAUS_CLIENT_SECRET).
  # Redirect URI ini harus terdaftar di client PAuS.
  PAUS_CLIENT_ID: "TQJXe0CR9WiJg.paus.unpad.ac.id"
  PAUS_REDIRECT_URI: "https://suara.fmipa.unpad.ac.id/api/auth/paus/callback"

  # Bucket privat. AWS_URL = base proxy MinIO (termasuk bucket); gambar dibuka lewat
  # temporary URL yang ditandatangani app. TODO: konfirmasi host proxy prod ke DevOps.
  AWS_BUCKET: "prod-suaraunpad-ppl-storage"
  AWS_URL: "https://svc.unpad.ac.id/minio/prod-suaraunpad-ppl-storage"
  STORAGE_ROOT_FOLDER: ""

  # Email/NPM PAuS (pisahkan koma) yang dibuatkan akun ADMIN saat login PERTAMA.
  # Orang yang sudah punya akun (mis. akun mahasiswa) tetap memakai akun & role lamanya.
  ADMIN_IDENTIFIERS: ""
